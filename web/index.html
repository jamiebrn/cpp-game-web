<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <title>game</title>
</head>

<body>
  <style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    width: 100%;
    height: 100%;
  }
  </style>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" onmousedown="if(event.button===1){event.preventDefault();}" tabindex=-1></canvas>

    <script>
      let canvasElement = document.querySelector('#canvas')

      var Module = {
        canvas: canvasElement,
      }

      window.addEventListener('keydown', function(event) {
        if (event.key === 'F5' || ((event.ctrlKey || event.metaKey) && event.key === 'r')
          || event.key == 'F11'
        ) {
          event.stopImmediatePropagation();
        }
      }, true)
      </script>

    <script async type="text/javascript" src="game.js"></script>
  </body>
</html>
